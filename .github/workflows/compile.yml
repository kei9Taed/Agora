name: Compile check

# Fast gate: does every Kotlin source still compile? No unit tests, no APK, no NDK.
# Runs on pull requests and on master pushes that touch code, so a broken reference is
# reported in a few minutes instead of after a 40-minute test run.
#
# All actions are pinned to full-length commit SHAs because this fork's Actions policy
# rejects floating tags. Keep the `# vX.Y.Z` comments when bumping a pin.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Kotlin compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"

      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      # Main sources first, then test sources: a stale reference in a test file
      # ("Unresolved reference") is exactly the class of failure this job exists for.
      - name: Compile main sources
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileFdroidDebugKotlin --no-daemon --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process --stacktrace

      - name: Compile unit-test sources
        run: |
          ./gradlew :app:compileFdroidDebugUnitTestKotlin --no-daemon --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process --stacktrace

      - name: Compile Play flavor sources
        run: |
          ./gradlew :app:compilePlayDebugKotlin --no-daemon --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process --stacktrace

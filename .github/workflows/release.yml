name: Release APK

# Tag-driven releases: `git tag v0.2.0 && git push origin v0.2.0`.
# The tag is the version; nothing in Gradle has to change for a fork build.
#
# Every action below is pinned to a full-length commit SHA because this fork's
# Actions policy rejects floating tags ("all actions must be pinned to a
# full-length commit SHA"). Keep the `# vX.Y.Z` comment for readability when
# bumping a pin.
on:
  push:
    tags:
      - 'v*'
  # Manual run builds the APK and uploads it as a workflow artifact without creating a
  # release, so the pipeline can be smoke-tested without burning a version tag.
  workflow_dispatch:

permissions:
  contents: write   # required to create the release and upload the APK asset

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"

      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      - name: Run application, library and build-logic tests
        timeout-minutes: 35
        run: |
          chmod +x ./gradlew
          ./gradlew -p build-logic test --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
          ./gradlew :app:testFdroidDebugUnitTest :core:model:test :core:contracts:test :core:presentation:test :data:database:test :provider:cloud:test verifyKotlinFileSize --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace

  build:
    name: Build release APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools ndk;28.2.13676358"

      # Release signing is optional. Without these secrets Gradle falls back to the
      # debug keystore, which installs but cannot update a differently-signed build.
      - name: Restore signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks
          cat >> local.properties <<EOF
          storeFile=${{ github.workspace }}/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      - name: Build PRoot runtime
        run: |
          chmod +x ./build-proot.sh
          ./build-proot.sh

      - name: Build F-Droid Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFdroidRelease

      - name: Verify PRoot runtime packaging
        run: |
          apk_path=$(find app/build/outputs/apk/fdroid/release -name '*.apk' -print -quit)
          test -n "$apk_path"
          apk_entries=$(mktemp)
          trap 'rm -f "$apk_entries"' EXIT
          unzip -Z1 "$apk_path" > "$apk_entries"
          for library in libproot_exec.so libproot_loader.so libtalloc.so; do
            entry="lib/arm64-v8a/$library"
            grep -Fxq "$entry" "$apk_entries" || {
              echo "Missing PRoot runtime library: $library" >&2
              exit 1
            }
          done

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agora-fdroid-release-${{ github.ref_name }}
          path: app/build/outputs/apk/fdroid/release/*.apk
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@28ab305d0ffa26d60ec4bd614126329e26c7a0ec # v3.0.4
        with:
          files: app/build/outputs/apk/fdroid/release/*.apk
          generate_release_notes: true
          # Tags with a suffix (v0.2.0-beta1) become pre-releases automatically.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
